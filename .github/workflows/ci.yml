name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -S .
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  pyeda-crosscheck:
    runs-on: ubuntu-latest
    needs: build-and-test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements-verify.txt
      - run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release && cmake --build build
      - run: python scripts/verify_pyeda.py --bin build/src/minimization/lss_minimize --random 200

  benchmark:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Configure & build
        run: |
          cmake -B build -S .
          cmake --build build
      - name: Run ISCAS-85 benchmark suite
        run: echo "TODO: run built binary against benchmarks/iscas85/ and update docs/benchmark_results.md"
