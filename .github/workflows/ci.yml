name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -S .
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  benchmark:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Configure & build
        run: |
          cmake -B build -S .
          cmake --build build
      - name: Run ISCAS-85 benchmark suite
        run: echo "TODO: run built binary against benchmarks/iscas85/ and update docs/benchmark_results.md"
